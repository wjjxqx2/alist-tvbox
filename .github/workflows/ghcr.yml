name: Build and Push alist-tvbox to GHCR

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-base:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ./web-ui

      - name: Install npm
        working-directory: ./web-ui
        run: npm ci

      - name: Build web UI
        working-directory: ./web-ui
        run: npm run build
        env:
          VITE_TELEGRAM_INVITE_LINK: ${{ secrets.VITE_TELEGRAM_INVITE_LINK }}

      - name: Setup GraalVM
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: "graalvm"
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: "maven"

      - name: Build with Maven
        run: mvn -B package --file pom.xml

      - name: Extract Spring Boot layers
        working-directory: ./target
        run: java -Djarmode=layertools -jar alist-tvbox-1.0.jar extract

      - name: Set APP version
        id: version
        run: |
          [ -d data ] || mkdir data
          export TZ=Asia/Shanghai
          echo $((($(date +%Y) - 2023) * 366 + $(date +%j | sed 's/^0*//'))).$(date +%H%M) > data/version
          echo "${{ github.event.head_commit.message }}" >> data/version
          cp data/version data/app_version
          echo "version=$(cat data/version)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-artifacts
          path: |
            target/
            data/
            src/
            pom.xml
            web-ui/dist/
          retention-days: 1

  build-and-push-ghcr:
    needs: build-base
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          name: build-artifacts
          path: .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tags
        id: meta
        run: |
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/alist-tvbox"
          VERSION="${{ github.ref_name }}"
          echo "IMAGE_NAME=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo "LATEST_TAG=$IMAGE_NAME:latest" >> "$GITHUB_OUTPUT"
          echo "VERSION_TAG=$IMAGE_NAME:$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push alist-tvbox image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.meta.outputs.VERSION_TAG }}
            ${{ steps.meta.outputs.LATEST_TAG }}
          cache-from: type=gha,scope=alist-tvbox
          cache-to: type=gha,mode=max,scope=alist-tvbox

      - name: Test image (amd64)
        run: |
          docker run -d --name test-alist-tvbox -p 4567:4567 ghcr.io/${{ github.repository_owner }}/alist-tvbox:${{ github.ref_name }}
          echo "Waiting for AList to start (max 60 seconds)..."
          SUCCESS=false
          for i in {1..30}; do
            RESPONSE=$(curl -s http://localhost:4567/api/alist/status || echo "0")
            echo "Attempt $i/30: status=$RESPONSE"
            if [ "$RESPONSE" == "2" ]; then
              echo "✅ AList is running (status=2)"
              SUCCESS=true
              break
            elif [ "$RESPONSE" == "1" ]; then
              echo "⏳ AList is starting, waiting..."
            else
              echo "❌ AList not responding, waiting..."
            fi
            sleep 2
          done
          if [ "$SUCCESS" != "true" ]; then
            echo "❌ Test failed: AList did not reach status 2 within 60 seconds"
            docker logs test-alist-tvbox
            docker stop test-alist-tvbox
            docker rm test-alist-tvbox
            exit 1
          fi
          echo "✅ Test passed"
          docker stop test-alist-tvbox
          docker rm test-alist-tvbox
